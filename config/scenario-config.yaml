# Battle scenario settings (brownfield support).
# Separate from project-config.yaml on purpose: the generator's flat parser already uses keys like "type".
# Keys must stay unique across this file.

# Folder for all projects: generated (greenfield, marked with .sdlc-generated) and downloaded by the user.
# The generator replaces only folders carrying its marker; anything else needs -Force.
projectsDir: projects

# greenfield | buildfix | bugfix | sonarfix | vulnfix | refactor | feature | tests | migration | review
scenarioType: greenfield
# Folder name inside projectsDir (ignored for greenfield)
scenarioProject: ""

# Limits (used by the orchestrator from Phase 2 on)
maxFixIterations: 5
maxOfficialCiAttempts: 2
sameGateStopAfter: 3

# Brownfield gates (copied into the project as sdlc-settings.json by attach-project.ps1)
diffGuardMaxFiles: 15
diffGuardMaxLines: 400
diffGuardMode: warn               # warn | fail
coverageTolerance: 0.0            # allowed drop of line coverage vs baseline, in percentage points
