# Factory scenario policy and optional defaults.
# The current repository, branch and task should normally be supplied as command
# parameters or by the orchestrator; these fields are intentionally optional.

# Folder for generated/downloaded projects.
projectsDir: projects

# Optional default scenario. Empty means start-scenario.ps1 uses greenfield only
# when no scenario is supplied; brownfield scenarios require an explicit one.
scenarioType: ""
scenarioProject: ""
scenarioRepoUrl: ""
scenarioBaseBranch: ""
# auto = orchestrator chooses quick/full after review; explicit quick/full is allowed.
vulnfixMode: auto

# Target versions used by the migration scenario. vulnfix does not imply a platform migration.
migrationBootVersion: 4.1.1
migrationJavaVersion: 25

# Orchestrator limits.
maxFixIterations: 5
maxOfficialCiAttempts: 2
sameGateStopAfter: 3

# Brownfield gates copied into sdlc-settings.json by attach-project.ps1.
# fail is the safe default: a change exceeding the scenario budget must stop.
diffGuardMaxFiles: 40
diffGuardMaxLines: 1500
diffGuardMode: fail
coverageTolerance: 0.0
