# Factory defaults for Spring Boot projects.
# Machine- and corporation-specific values belong in project-config.local.yaml,
# which is ignored by Git and loaded automatically by the scripts.

project:
  type: maven-project              # maven-project | gradle-project
  language: java                   # java | kotlin | groovy
  bootVersion: 4.1.1               # Spring Boot version ('latest' = Initializr default)
  groupId: pl.erste.sdlc
  artifactId: springboot-sdlc-demo
  name: springboot-sdlc-demo
  description: "Spring Boot Service with Automated AI & Quality Pipeline"
  packageName: pl.erste.sdlc.demo
  packaging: jar                   # jar | war
  javaVersion: 25                  # 17 | 21 | 25

dependencies:
  - web
  - validation
  - actuator
  - lombok
  - devtools

# Database used by env-up.ps1 / env-down.ps1. The project may override this
# locally or the user may pass -Database/-DbPort/-DbHost explicitly.
# none | mongodb | postgresql | db2 | h2
databaseType: none
databasePort: 0
databaseHost: localhost

maven:
  # Empty = Maven uses the default ~/.m2/settings.xml.
  settingsFile: ""
  # Empty = Java/Maven from PATH. attach-project.ps1 uses these when provided.
  jdksDir: ""
  mavenVersion: 3.9.16
  mavensDir: ""

sdlc:
  enableSonarQube: true
  enableOwaspCheck: false
  sonarHostUrl: "http://localhost:9000"
  owaspFailOnCvss: 7.0
  owaspFailOnError: false
  # Xray is enabled by the corporate local override once xrayUrl is configured.
  enableXray: false
  xrayUrl: ""
  xrayWatches: ""
  xrayInsecureTls: false
  jacocoVersion: 0.8.15
