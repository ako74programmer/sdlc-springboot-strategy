# Configuration file for Spring Boot Project Generator (Spring Initializr API)

project:
  type: maven-project              # maven-project | gradle-project
  language: java                   # java | kotlin | groovy
  bootVersion: 4.1.1               # Spring Boot version ('latest' = Initializr recommended default)
  groupId: pl.erste.sdlc
  artifactId: springboot-sdlc-demo
  name: springboot-sdlc-demo
  description: "Spring Boot Service with Automated AI & Quality Pipeline"
  packageName: pl.erste.sdlc.demo
  packaging: jar                   # jar | war
  javaVersion: 25                  # 17 | 21 | 25

# Spring Initializr dependency keys (matching start.spring.io identifiers)
dependencies:
  - web                            # Spring Web
  - data-mongodb                   # Spring Data MongoDB (local mongod on 127.0.0.1:27017)
  - validation                     # Validation (Hibernate Validator)
  - actuator                       # Spring Boot Actuator
  - lombok                         # Lombok
  - devtools                       # Spring Boot DevTools

# Maven build settings
maven:
  # Artifact resolution goes through the corporate Artifactory configured in this file.
  # Leave empty to rely on Maven's default ~/.m2/settings.xml.
  settingsFile: "C:\Users\160246\.m2\settings.xml"
  # Folder with JDKs (it and its subfolders are searched for a 'release' file); attach-project.ps1 picks the one
  # matching the project's Java version. Empty = java from PATH.
  jdksDir: "C:\Users\160246\Desktop\java-tools\java"

# SDLC Pipeline Enrichments
sdlc:
  enableSonarQube: true
  enableOwaspCheck: false          # off: NVD database cannot be downloaded here; the corporate Xray scan is the vulnerability gate
  sonarHostUrl: "http://localhost:9000"
  owaspFailOnCvss: 7.0             # CVSS score threshold to fail build (High/Critical)
  owaspFailOnError: false          # only with enableOwaspCheck: true; true = a failed NVD update/analysis fails the gate
  enableXray: true                 # JFrog Xray gate - zero findings allowed (token: JF_ACCESS_TOKEN or jfrog.token)
  xrayUrl: "https://ewsi.centrala.bzwbk:9999"
  xrayWatches: "XrayWatch"         # comma-separated Xray watches
  xrayInsecureTls: true            # corporate CA not trusted by jf
  jacocoVersion: 0.8.15            # must support the class file version of javaVersion (0.8.15 = Java 25)
