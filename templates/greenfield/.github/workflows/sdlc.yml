name: SDLC Quality Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  sdlc-pipeline:
    name: Build, Test & Quality Gates
    runs-on: ubuntu-latest

    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      JF_URL: ${{ secrets.JF_URL }}
      JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # Gate 1: Compilation
      - name: "[GATE 1/5] Compile"
        run: ./mvnw clean compile -B -q

      # Gate 2: Tests + Coverage
      - name: "[GATE 2/5] Tests"
        run: ./mvnw verify -B

      # Gate 3: OWASP Dependency Check
      - name: "[GATE 3/5] Vulnerability Scan"
        run: ./mvnw org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7.0 -DautoUpdate=true -B

      # JFrog Xray scan of the jar built by the Tests gate (zero findings allowed).
      # Runs only when the project has jfrog-xray.properties and JF_URL / JF_ACCESS_TOKEN secrets are set.
      - name: Setup JFrog CLI
        if: env.JF_URL != '' && env.JF_ACCESS_TOKEN != '' && hashFiles('jfrog-xray.properties') != ''
        uses: jfrog/setup-jfrog-cli@v4

      - name: "[GATE 4/5] Xray Scan"
        if: env.JF_URL != '' && env.JF_ACCESS_TOKEN != '' && hashFiles('jfrog-xray.properties') != ''
        run: pwsh -File ./tools/jfrog-scan.ps1 -SkipConfig

      # SonarQube Analysis (external server, configured via secrets)
      - name: "[GATE 5/5] SonarQube Analysis"
        if: env.SONAR_HOST_URL != ''
        run: |
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true \
            -B

      - name: Upload SDLC Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-report
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/dependency-check-report.*
            target/xray-report.json
            target/xray-findings.json
