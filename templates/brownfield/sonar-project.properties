# SonarQube Project Configuration (created by scripts/attach-project.ps1)
# Only what pom.xml cannot say. Sources, tests, binaries, encoding and the JaCoCo report path come from the
# project's pom.xml and the Maven scanner defaults, exactly as in CI: tools\sdlc.ps1 passes every line below
# as -D, which overrides pom.xml.
sonar.projectKey={{groupId}}:{{artifactId}}
sonar.projectName={{name}}
sonar.host.url={{sonarHostUrl}}
sonar.scm.disabled=true
