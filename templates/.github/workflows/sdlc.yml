name: SDLC Quality Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  sdlc-pipeline:
    name: Build, Test & Quality Gates
    runs-on: ubuntu-latest

    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Gate 1: Compilation
      - name: "[GATE 1/4] Compile"
        run: ./mvnw clean compile -B -q

      # Gate 2: Tests + Coverage
      - name: "[GATE 2/4] Tests"
        run: ./mvnw verify -B

      # Gate 3: OWASP Dependency Check
      - name: "[GATE 3/4] Vulnerability Scan"
        run: ./mvnw org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7.0 -DautoUpdate=true -B

      # Gate 4: SonarQube Analysis (external server, configured via secrets)
      - name: "[GATE 4/4] SonarQube Analysis"
        if: env.SONAR_HOST_URL != ''
        run: |
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true \
            -B

      - name: Upload SDLC Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-report
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/dependency-check-report.*
